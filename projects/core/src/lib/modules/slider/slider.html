<div class="bizy-slider">
    @if (isSingle) {
        <input
            type="range"
            aria-label="Value"
            [ngModel]="displayValue"
            [min]="limit.min"
            [max]="limit.max"
            [step]="step"
            [style.background]="'linear-gradient(to right, var(--bizy-slider-range-color) 0%, var(--bizy-slider-range-color) ' + valuePercent + '%, var(--bizy-slider-color) ' + valuePercent + '%, var(--bizy-slider-color) 100%)'"
            (pointerdown)="selectBullet('value', $event)"
            (keydown)="selectBulletWithKeyboard('value', $event)"
            (keyup)="releaseBulletWithKeyboard('value', $event)"
            (blur)="releaseBulletOnBlur('value')"
            (ngModelChange)="setValueSlider($event)" />
    } @else {
        <input
            #fromSlider
            class="bizy-slider__from"
            type="range"
            aria-label="Minimum"
            [ngModel]="displayMin"
            [min]="limit.min"
            [max]="limit.max"
            [step]="step"
            (pointerdown)="selectBullet('min', $event)"
            (keydown)="selectBulletWithKeyboard('min', $event)"
            (keyup)="releaseBulletWithKeyboard('min', $event)"
            (blur)="releaseBulletOnBlur('min')"
            (ngModelChange)="setFromSlider($event)" />

        <input
            #toSlider
            type="range"
            aria-label="Maximum"
            [style.background]="'linear-gradient(to right, var(--bizy-slider-color) 0%, var(--bizy-slider-color) ' + minPercent + '%, var(--bizy-slider-range-color) ' + minPercent + '%, var(--bizy-slider-range-color) ' + maxPercent + '%, var(--bizy-slider-color) ' + maxPercent + '%, var(--bizy-slider-color) 100%)'"
            [ngModel]="displayMax"
            [min]="limit.min"
            [max]="limit.max"
            [step]="step"
            (pointerdown)="selectBullet('max', $event)"
            (keydown)="selectBulletWithKeyboard('max', $event)"
            (keyup)="releaseBulletWithKeyboard('max', $event)"
            (blur)="releaseBulletOnBlur('max')"
            (ngModelChange)="setToSlider($event)" />
    }
</div>
